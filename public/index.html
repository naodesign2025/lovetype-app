<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋愛タイプ診断</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #0f0f1a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 560px;
      width: 100%;
    }

    /* Auth bar */
    .auth-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      font-size: 13px;
    }

    .auth-bar .user-username {
      color: #aaa;
    }

    .btn-auth-link {
      background: none;
      border: 1px solid #ff6b9d;
      color: #ff6b9d;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-auth-link:hover {
      background: #ff6b9d;
      color: #fff;
    }

    /* Start screen */
    #start-screen {
      text-align: center;
    }

    .title-emoji {
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ff6b9d, #ff9a5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 40px;
      line-height: 1.7;
    }

    .btn-start {
      background: linear-gradient(135deg, #ff6b9d, #ff9a5c);
      color: #fff;
      border: none;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px rgba(255, 107, 157, 0.35);
      letter-spacing: 0.08em;
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(255, 107, 157, 0.5);
    }

    .btn-start:active {
      transform: translateY(0);
    }

    /* Quiz screen */
    #quiz-screen {
      display: none;
    }

    .progress-bar-wrap {
      background: #1e1e30;
      border-radius: 10px;
      height: 6px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff6b9d, #ff9a5c);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .question-count {
      font-size: 12px;
      color: #888;
      text-align: right;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.65;
      margin-bottom: 28px;
      min-height: 72px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-btn {
      background: #1e1e30;
      color: #f0f0f0;
      border: 2px solid #2a2a40;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .choice-btn:hover {
      background: #28283e;
      border-color: #ff6b9d;
      transform: translateX(4px);
    }

    .choice-btn:active {
      transform: translateX(2px);
    }

    .choice-label {
      font-weight: 700;
      color: #ff9a5c;
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Result screen */
    #result-screen {
      display: none;
      text-align: center;
    }

    .result-emoji {
      font-size: 72px;
      display: block;
      margin-bottom: 16px;
      animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop-in {
      from { transform: scale(0.4); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .result-type-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ff6b9d, #ff9a5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-description {
      font-size: 15px;
      line-height: 1.8;
      color: #ddd;
      background: #1e1e30;
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
      text-align: left;
    }

    .result-strengths {
      font-size: 13px;
      color: #ff9a5c;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-top: 14px;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-save {
      background: linear-gradient(135deg, #ff6b9d, #ff9a5c);
      color: #fff;
      border: none;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(255, 107, 157, 0.35);
      letter-spacing: 0.06em;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 107, 157, 0.5);
    }

    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login-to-save {
      background: transparent;
      color: #ff9a5c;
      border: 2px solid #ff9a5c;
      padding: 14px 40px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.06em;
    }

    .btn-login-to-save:hover {
      background: #ff9a5c;
      color: #fff;
    }

    .btn-retry {
      background: transparent;
      color: #ff6b9d;
      border: 2px solid #ff6b9d;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.06em;
    }

    .btn-retry:hover {
      background: #ff6b9d;
      color: #fff;
    }

    .save-message {
      font-size: 14px;
      margin-top: 4px;
      min-height: 20px;
    }

    .save-message.success { color: #4ade80; }
    .save-message.error { color: #f87171; }

    .hidden {
      display: none !important;
    }

    /* Modal overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #1a1a2e;
      border: 1px solid #2a2a45;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover { color: #f0f0f0; }

    .modal-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 28px;
      background: #0f0f1a;
      border-radius: 10px;
      padding: 4px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: #888;
      padding: 10px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn.active {
      background: #2a2a45;
      color: #f0f0f0;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      color: #aaa;
    }

    .form-group input {
      background: #0f0f1a;
      border: 1px solid #2a2a45;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      color: #f0f0f0;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input:focus {
      border-color: #ff6b9d;
    }

    .btn-submit {
      background: linear-gradient(135deg, #ff6b9d, #ff9a5c);
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s;
      letter-spacing: 0.05em;
    }

    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .form-error {
      color: #f87171;
      font-size: 13px;
      min-height: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Auth Bar -->
    <div class="auth-bar">
      <span class="user-username" id="user-username"></span>
      <button class="btn-auth-link" id="auth-btn" onclick="handleAuthBtnClick()">ログイン</button>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
      <span class="title-emoji">💘</span>
      <h1>恋愛タイプ診断</h1>
      <p class="subtitle">5問の質問に答えるだけ。<br>あなたの恋愛タイプがわかります。</p>
      <button class="btn-start" onclick="startQuiz()">診断スタート</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="question-count" id="question-count"></div>
      <div class="question-text" id="question-text"></div>
      <div class="choices" id="choices"></div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen">
      <span class="result-emoji" id="result-emoji"></span>
      <div class="result-type-name" id="result-type-name"></div>
      <div class="result-description">
        <div id="result-body"></div>
        <div class="result-strengths" id="result-strengths"></div>
      </div>
      <div class="result-actions">
        <button class="btn-save hidden" id="btn-save" onclick="saveResult()">結果を保存する</button>
        <button class="btn-login-to-save hidden" id="btn-login-to-save" onclick="openAuthModal()">ログインして保存する</button>
      </div>
      <div class="save-message" id="save-message"></div>
      <button class="btn-retry" onclick="resetQuiz()">もう一度やる</button>
    </div>

  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal">
      <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      <div class="modal-tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">ログイン</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">新規登録</button>
      </div>
      <form class="modal-form" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label for="input-username">ユーザー名</label>
          <input type="text" id="input-username" placeholder="例: lovetype_user" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="input-password">パスワード</label>
          <input type="password" id="input-password" placeholder="8文字以上" required autocomplete="current-password" minlength="8">
        </div>
        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn-submit" id="btn-submit">ログイン</button>
      </form>
    </div>
  </div>

  <script>
    // Types: 0=fire(情熱), 1=mystery(謎), 2=angel(癒し), 3=devil(悪魔)
    const TYPES = [
      {
        key: 'fire',
        emoji: '🔥',
        name: '情熱の一途系',
        body: '好きになったら全部やろうとするタイプ。それは長所だけど、たまに相手がびっくりすることもある。でも本気の人間ってそういうもの。その熱さ、一生持ち続けてください。',
        strengths: '強み：誠実さ、情熱、行動力'
      },
      {
        key: 'mystery',
        emoji: '🎭',
        name: '謎めいたミステリー系',
        body: '近づきたいけど、何考えてるかわからない。それがあなたの武器。でも正直に言うと、たまには素を出してみて。その方が絶対いい。',
        strengths: '強み：独自性、深さ、知的魅力'
      },
      {
        key: 'angel',
        emoji: '🌸',
        name: '癒しの天使系',
        body: 'あなたがいるだけで場が和む。それって本物の才能です。ただ、自分を後回しにしすぎないで。あなたの幸せが、周りの幸せにもつながるから。',
        strengths: '強み：共感力、優しさ、包容力'
      },
      {
        key: 'devil',
        emoji: '😈',
        name: '振り回す悪魔系',
        body: '好きにさせておいて逃げるタイプ。でもそれは悪意じゃなくて、ただ自由が好きなだけ。縛られるのが嫌いなあなたには、同じ空気感を持てる人が合う。',
        strengths: '強み：自由さ、独立心、カリスマ性'
      }
    ];

    const QUESTIONS = [
      {
        text: '財布に200円しかない。でも500円の弁当が食いたい。どうする？',
        choices: [
          { label: 'A', text: '諦めて100円のパンにする', type: 2 },
          { label: 'B', text: '誰かに300円借りる', type: 1 },
          { label: 'C', text: 'カードで買う（後悔する）', type: 3 },
          { label: 'D', text: '絶対買う、方法は後で考える', type: 0 }
        ]
      },
      {
        text: '突然、3日間ひとりで過ごせる時間ができた。何する？',
        choices: [
          { label: 'A', text: 'とにかく誰かに連絡する', type: 2 },
          { label: 'B', text: 'ひたすら趣味に没頭する', type: 0 },
          { label: 'C', text: '特に何もせず漂う', type: 3 },
          { label: 'D', text: '計画立てて全部こなす', type: 1 }
        ]
      },
      {
        text: '好きな映画のジャンルは？',
        choices: [
          { label: 'A', text: 'アクション・冒険系', type: 0 },
          { label: 'B', text: 'ラブストーリー・ドラマ', type: 2 },
          { label: 'C', text: 'ホラー・サスペンス', type: 1 },
          { label: 'D', text: 'コメディ・なんでもOK', type: 3 }
        ]
      },
      {
        text: '朝起きてまず何する？',
        choices: [
          { label: 'A', text: '即スマホチェック', type: 2 },
          { label: 'B', text: 'ぼーっとしてから動く', type: 1 },
          { label: 'C', text: 'すぐ活動開始', type: 0 },
          { label: 'D', text: '二度寝する', type: 3 }
        ]
      },
      {
        text: '道に千円落ちてた。どうする？',
        choices: [
          { label: 'A', text: '即交番に届ける', type: 0 },
          { label: 'B', text: 'うっすら迷って届ける', type: 2 },
          { label: 'C', text: 'ラッキーと思いながら届ける', type: 1 },
          { label: 'D', text: '神様からのプレゼントだと思って使う', type: 3 }
        ]
      }
    ];

    let current = 0;
    let scores = [0, 0, 0, 0];
    let lastResultType = null;
    let lastResultName = null;
    let lastScores = null;
    let currentTab = 'login';

    // ---- Auth state ----
    function getToken() { return localStorage.getItem('lovetype_token'); }
    function getUser() {
      const u = localStorage.getItem('lovetype_user');
      return u ? JSON.parse(u) : null;
    }
    function setSession(token, user) {
      localStorage.setItem('lovetype_token', token);
      localStorage.setItem('lovetype_user', JSON.stringify(user));
    }
    function clearSession() {
      localStorage.removeItem('lovetype_token');
      localStorage.removeItem('lovetype_user');
    }

    function updateAuthBar() {
      const user = getUser();
      const authBtn = document.getElementById('auth-btn');
      const userUsername = document.getElementById('user-username');
      if (user) {
        userUsername.textContent = user.username;
        authBtn.textContent = 'ログアウト';
      } else {
        userUsername.textContent = '';
        authBtn.textContent = 'ログイン';
      }
    }

    function handleAuthBtnClick() {
      if (getUser()) {
        clearSession();
        updateAuthBar();
        updateSaveButtons();
      } else {
        openAuthModal();
      }
    }

    // ---- Modal ----
    function openAuthModal() {
      document.getElementById('modal-overlay').classList.add('active');
      document.getElementById('input-username').focus();
    }

    function closeAuthModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      document.getElementById('form-error').textContent = '';
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modal-overlay')) closeAuthModal();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('btn-submit').textContent = tab === 'login' ? 'ログイン' : '登録する';
      document.getElementById('form-error').textContent = '';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('input-username').value.trim();
      const password = document.getElementById('input-password').value;
      const errorEl = document.getElementById('form-error');
      const submitBtn = document.getElementById('btn-submit');

      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = '処理中...';

      const endpoint = currentTab === 'login' ? '/api/auth/login' : '/api/auth/register';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'エラーが発生しました';
          return;
        }

        setSession(data.token, data.user);
        updateAuthBar();
        closeAuthModal();
        updateSaveButtons();
      } catch {
        errorEl.textContent = 'ネットワークエラーが発生しました';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = currentTab === 'login' ? 'ログイン' : '登録する';
      }
    }

    // ---- Quiz ----
    function startQuiz() {
      current = 0;
      scores = [0, 0, 0, 0];
      lastResultType = null;
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      const q = QUESTIONS[current];
      const total = QUESTIONS.length;

      document.getElementById('progress-bar').style.width = ((current / total) * 100) + '%';
      document.getElementById('question-count').textContent = `${current + 1} / ${total}`;
      document.getElementById('question-text').textContent = `Q${current + 1}. ${q.text}`;

      const choicesEl = document.getElementById('choices');
      choicesEl.innerHTML = '';
      q.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span class="choice-label">${choice.label}</span><span>${choice.text}</span>`;
        btn.onclick = () => selectAnswer(choice.type);
        choicesEl.appendChild(btn);
      });
    }

    function selectAnswer(type) {
      scores[type]++;
      current++;
      if (current < QUESTIONS.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      let maxScore = -1;
      let resultIdx = 0;
      scores.forEach((s, i) => {
        if (s > maxScore) { maxScore = s; resultIdx = i; }
      });

      const type = TYPES[resultIdx];
      lastResultType = type.key;
      lastResultName = type.name;
      lastScores = { fire: scores[0], mystery: scores[1], angel: scores[2], devil: scores[3] };

      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';
      document.getElementById('result-emoji').textContent = type.emoji;
      document.getElementById('result-type-name').textContent = type.name;
      document.getElementById('result-body').textContent = type.body;
      document.getElementById('result-strengths').textContent = type.strengths;
      document.getElementById('progress-bar').style.width = '100%';
      document.getElementById('save-message').textContent = '';
      document.getElementById('save-message').className = 'save-message';

      updateSaveButtons();
    }

    function updateSaveButtons() {
      const isOnResult = document.getElementById('result-screen').style.display === 'block';
      const btnSave = document.getElementById('btn-save');
      const btnLoginToSave = document.getElementById('btn-login-to-save');

      if (!isOnResult) return;

      if (getUser()) {
        btnSave.classList.remove('hidden');
        btnLoginToSave.classList.add('hidden');
      } else {
        btnSave.classList.add('hidden');
        btnLoginToSave.classList.remove('hidden');
      }
    }

    async function saveResult() {
      const token = getToken();
      if (!token || !lastResultType) return;

      const saveBtn = document.getElementById('btn-save');
      const msgEl = document.getElementById('save-message');
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中...';
      msgEl.textContent = '';

      try {
        const res = await fetch('/api/results', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            resultType: lastResultType,
            resultName: lastResultName,
            scores: lastScores
          })
        });
        const data = await res.json();

        if (!res.ok) {
          msgEl.textContent = data.error || '保存に失敗しました';
          msgEl.className = 'save-message error';
          saveBtn.textContent = '結果を保存する';
          saveBtn.disabled = false;
          return;
        }

        msgEl.textContent = '保存しました！';
        msgEl.className = 'save-message success';
        saveBtn.textContent = '保存済み';
      } catch {
        msgEl.textContent = 'ネットワークエラーが発生しました';
        msgEl.className = 'save-message error';
        saveBtn.textContent = '結果を保存する';
        saveBtn.disabled = false;
      }
    }

    function resetQuiz() {
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'block';
      document.getElementById('btn-save').classList.add('hidden');
      document.getElementById('btn-login-to-save').classList.add('hidden');
    }

    // Init
    updateAuthBar();
  </script>
</body>
</html>
